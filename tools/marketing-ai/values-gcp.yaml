#   release: 'ci360-analytic-mai'
# to switch to mai license, we need 129-132 to a tenant present on demo. Images to push to demo from dev with *mai* naming convention.

registry:
  url: "418062132543.dkr.ecr.us-east-1.amazonaws.com"

otel:
  mode: deployment
  replicaCount: 1
  service:
    type: ClusterIP
  livenessProbe:
    httpGet:
      path: /
      port: 13133
    initialDelaySeconds: 20
    periodSeconds: 20
    failureThreshold: 5
  serviceAccount:
    create: false
    name: otel-sa
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.136.0
    pullPolicy: IfNotPresent

  config:
    receivers:
      # OTLP receiver for FastAPI orchestrator (logs, metrics, traces)
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    # Prometheus receiver for scraping Airflow, Postgres, and Orchestrator metrics

    processors:
      resourcedetection:
        detectors: [system]
      # resource/add-airflow-service:
      #   attributes:
      #     - key: service.name
      #       value: Airflow
      #       action: upsert
      batch:
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        limit_mib: 4096
        spike_limit_mib: 512

    service:
      telemetry:
        logs:
          level: debug
      pipelines:
        # Logs pipeline: OTLP + filelog → Datadog
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [datadog]
        # Metrics pipeline: OTLP + Prometheus → Datadog
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [datadog]
        # Traces pipeline: OTLP → Datadog
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [datadog]

helmtestjob:
  image:
    repository: "418062132543.dkr.ecr.us-east-1.amazonaws.com/ci360-cldeng-image-manager/shared-images-demo"
    tag: "lic_mai.mai-helm-tests"
